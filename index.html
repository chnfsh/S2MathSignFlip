<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学可视化互动工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f14;
    --panel:#11181f;
    --line:#232d38;
    --text:#eef2f6;
    --muted:#8b98a6;
    --accent:#5aa9ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column;
  }
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:12px 18px; border-bottom:1px solid var(--line);
    background:var(--panel); flex:none;
  }
  .topbar h1{font-size:1.05rem;margin:0;font-weight:700;white-space:nowrap;}
  .tabs{
    display:flex; gap:6px; overflow-x:auto; flex:1;
  }
  .tab{
    flex:none; display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:9px; cursor:pointer;
    color:var(--muted); font-size:.88rem; font-weight:600;
    border:1px solid transparent; white-space:nowrap;
    transition:.15s background, .15s color;
  }
  .tab:hover{background:#1a2431;color:var(--text);}
  .tab.active{background:#182636;color:var(--accent);border-color:#2a3d54;}
  .tab .emoji{font-size:1.05rem;}
  main{flex:1; min-height:0;}
  iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
  .empty{
    height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.9rem;
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🧮 数学可视化互动工具箱</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <main>
    <iframe id="toolFrame" title="互动工具"></iframe>
  </main>

<script>
  // ---- 加新工具：在这里加一行就够了，其它代码不用动 ----
  // file 是同一个文件夹里那个独立 HTML 工具的文件名
  const TOOLS = [
    { id:'timezone', name:'时差对齐尺', emoji:'🕒', file:'时差可视化模型.html' },
    { id:'snake',    name:'贪吃蛇数感', emoji:'🐍', file:'贪吃蛇数感.html' },
    { id:'debracket',name:'去括号特训', emoji:'📝', file:'代数式去括号特训_已修复.html' },
  ];
  // -------------------------------------------------------

  const tabsEl = document.getElementById('tabs');
  const frame = document.getElementById('toolFrame');

  function loadTool(tool){
    frame.src = tool.file;
    [...tabsEl.children].forEach(el=>{
      el.classList.toggle('active', el.dataset.id===tool.id);
    });
    try{ localStorage.setItem('toolboxLastTool', tool.id); }catch(e){}
  }

  TOOLS.forEach(tool=>{
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.dataset.id = tool.id;
    tab.innerHTML = `<span class="emoji">${tool.emoji}</span><span>${tool.name}</span>`;
    tab.addEventListener('click', ()=>loadTool(tool));
    tabsEl.appendChild(tab);
  });

  let startTool = TOOLS[0];
  try{
    const lastId = localStorage.getItem('toolboxLastTool');
    const found = TOOLS.find(t=>t.id===lastId);
    if(found) startTool = found;
  }catch(e){}
  if(startTool) loadTool(startTool);
</script>
</body>
</html>
